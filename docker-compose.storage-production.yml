# The current release helper adds this override only after protecting the old
# configuration. Data is copied from the existing MinIO volume into a DIFFERENT
# named volume. Never start storage-stage while the new minio service is running.
x-maintained-storage: &maintained-storage
  image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: ${OBJECT_STORAGE_MEMORY_LIMIT:-1536m}
  cpus: ${OBJECT_STORAGE_CPUS:-1.0}
  entrypoint: [/usr/bin/weed]
  command: &storage-command
    - server
    - -dir=/data
    - -ip=127.0.0.1
    - -ip.bind=127.0.0.1
    - -filer
    - -filer.exposeDirectoryData=false
    - -master.telemetry=false
    - -volume.max=0
    - -master.volumeSizeLimitMB=1024
    - -s3
    - -s3.ip.bind=0.0.0.0
    - -s3.port=9000
    - -s3.config=/run/secrets/s3.json
    - -s3.iam.config=/run/secrets/s3.json
    - -s3.iam=false
    - -s3.port.iceberg=0
    - -s3.port.lance=0
    - -s3.allowDeleteBucketNotEmpty=false
    - -s3.autoCreateBucket=false
  networks: [passdetection-net]
  volumes: &storage-volumes
    - object_storage_data:/data
    - type: bind
      source: ${OBJECT_STORAGE_IDENTITY_FILE:?Use release_current prepare before activating storage}
      target: /run/secrets/s3.json
      read_only: true
      bind: {create_host_path: false}
  healthcheck:
    # Anonymous S3 receives 403. Check only TCP here; the application readiness
    # gate independently authenticates and checks the actual configured bucket.
    test: [CMD-SHELL, "nc -z 127.0.0.1 9000"]
    interval: 5s
    timeout: 3s
    retries: 24
services:
  minio:
    <<: *maintained-storage
    # Keep the existing DNS name, port and public signed URLs stable.
    profiles: !reset []
    environment: !reset {}
    ports: !reset []
    volumes: !override
      - object_storage_data:/data
      - type: bind
        source: ${OBJECT_STORAGE_IDENTITY_FILE:?Run release_current prepare}
        target: /run/secrets/s3.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OBJECT_STORAGE_CUTOVER_PROOF:?Run the verified storage cutover}
        target: /run/secrets/cutover.json
        read_only: true
        bind: {create_host_path: false}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        test -s /run/secrets/cutover.json &&
        exec /usr/bin/weed server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1
        -filer -filer.exposeDirectoryData=false -master.telemetry=false
        -volume.max=0 -master.volumeSizeLimitMB=1024
        -s3 -s3.ip.bind=0.0.0.0 -s3.port=9000 -s3.config=/run/secrets/s3.json
        -s3.iam.config=/run/secrets/s3.json
        -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0
        -s3.allowDeleteBucketNotEmpty=false -s3.autoCreateBucket=false
  storage-stage:
    <<: *maintained-storage
    profiles: [maintenance]
    restart: "no"
  storage-copy:
    profiles: [maintenance]
    image: passdetection-backend
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: "1.0"
    command: [python, scripts/copy_storage_snapshot.py]
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?The existing application bucket is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      STORAGE_SOURCE_ENDPOINT: http://minio:9000
      STORAGE_SOURCE_ACCESS_KEY: ${MINIO_ROOT_USER:?Existing storage administrator required}
      STORAGE_SOURCE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Existing storage administrator required}
      STORAGE_DESTINATION_ENDPOINT: http://storage-stage:9000
      STORAGE_DESTINATION_ACCESS_KEY: ${OBJECT_STORAGE_ADMIN_ACCESS_KEY:?Prepare independent storage administrator}
      STORAGE_DESTINATION_SECRET_KEY: ${OBJECT_STORAGE_ADMIN_SECRET_KEY:?Prepare independent storage administrator}
      STORAGE_MIGRATION_JOURNAL: /evidence/object-versions.sqlite
    volumes:
      - type: bind
        source: ${OBJECT_STORAGE_MIGRATION_DIRECTORY:?Prepare protected migration evidence directory}
        target: /evidence
        bind: {create_host_path: false}
    networks: [passdetection-net]
volumes:
  object_storage_data:
    name: ${OBJECT_STORAGE_DATA_VOLUME:?Prepare a separate verified storage volume}
