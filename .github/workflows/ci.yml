name: CI — PassDetection Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: Lint & Compile Check ───────────────────────────────────────────
  backend-static-checks:
    name: Backend — Lint & Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: ruff check --no-fix app tests

      - name: Python compile check
        run: python -m compileall -q app tests alembic scripts

  backend-dependency-audit:
    name: Backend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependency auditor
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: Audit backend dependencies
        # python-jose installs ecdsa, but runtime configuration is constrained
        # and tested to HS256 so the ECDSA implementation is unreachable.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

  # ── Backend: Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: backend-static-checks
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: test-access-key
      S3_SECRET_ACCESS_KEY: test-secret-key
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov httpx

      - name: Apply database migrations
        run: |
          alembic heads
          alembic upgrade head
          alembic current

      - name: Run tests
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          # Coverage reporting is diagnostic; an unenrolled/unavailable external
          # Codecov repository must not hide successful tests or skip Docker builds.
          fail_ci_if_error: false
          files: backend/coverage.xml
          flags: backend

  # ── Frontend: Lint & Type Check ─────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Node contract and regression tests
        run: >-
          find . -type f -name '*.test.mjs'
          -not -path './node_modules/*'
          -not -path './.next/*'
          -print0 | sort -z | xargs -0 node --test --test-reporter=dot

  # ── Docker Build Verification ───────────────────────────────────────────────
  docker-build:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [backend-dependency-audit, backend-test, frontend-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Compose runtime separation
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          python scripts/verify_compose_runtime.py

      - name: Validate k6 harness syntax
        run: node --check load-tests/k6/passport-extraction.js

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: passdetection-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: passdetection-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
