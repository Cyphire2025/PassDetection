name: CI — PassDetection Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: Lint & Compile Check ───────────────────────────────────────────
  backend-static-checks:
    name: Backend — Lint & Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install ruff==0.16.0 uv==0.12.0

      - name: Verify hash-locked production dependencies
        run: |
          uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Install hash-locked backend runtime
        run: pip install --require-hashes -r requirements.lock

      - name: Ruff lint
        run: ruff check --no-fix app tests

      - name: Python compile check
        run: python -m compileall -q app tests alembic scripts

      - name: Verify one reviewed Alembic head
        run: python scripts/verify_migration_topology.py

      - name: Enforce backend size and complexity ratchets
        run: python scripts/verify_backend_quality_budgets.py

      - name: Verify CI supply-chain policy
        run: python ../scripts/verify_ci_supply_chain.py

  backend-dependency-audit:
    name: Backend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependency auditor
        run: |
          python -m pip install pip==26.2.1
          pip install pip-audit==2.10.1

      - name: Audit backend dependencies
        # pyattest 1.0.5 declares python-jose/ecdsa even though its published
        # verifier source does not import either package. The upstream ecdsa
        # advisory affects signing/keygen/ECDH; this service performs none of
        # those operations. Keep this one exact reviewed exception visible.
        run: >-
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-1325

      - name: Generate backend dependency SBOM
        run: >-
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-1325
          --format cyclonedx-json --output backend-sbom.cdx.json

      - name: Preserve backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-python-sbom-${{ github.sha }}
          path: backend/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Backend: Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    # The complete suite includes coverage over 2,000+ tests and can exceed
    # 30 minutes on a cold GitHub-hosted runner.
    timeout-minutes: 60
    needs: backend-static-checks
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: test-access-key
      S3_SECRET_ACCESS_KEY: test-secret-key
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==5.0.0 httpx==0.27.0 mypy==2.3.0

      - name: Apply database migrations
        run: |
          python scripts/verify_migration_topology.py
          alembic upgrade head
          alembic current
          alembic check

      - name: Verify backend-to-mobile OpenAPI contract
        run: python scripts/export_mobile_openapi_contract.py

      - name: Enforce strict backend typing
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=xml

      - name: Enforce critical-module coverage floors
        run: >-
          python scripts/verify_backend_quality_budgets.py
          --coverage-file coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          # Coverage reporting is diagnostic; an unenrolled/unavailable external
          # Codecov repository must not hide successful tests or skip Docker builds.
          fail_ci_if_error: false
          files: backend/coverage.xml
          flags: backend

  # Focused production-semantics lane. Fast SQLite tests remain the primary
  # feedback loop; this proves boundaries SQLite and mocks cannot represent.
  backend-service-integration:
    name: Backend - PostgreSQL, Redis, MinIO & Celery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-static-checks
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      RUN_SERVICE_INTEGRATION: "1"
      APP_ENV: development
      APP_SECRET_KEY: ci-service-integration-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: enterprise-ci-access
      S3_SECRET_ACCESS_KEY: enterprise-ci-secret-key
      S3_BUCKET_NAME: passdetection-enterprise-ci
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==5.0.0

      - name: Start pinned MinIO service
        working-directory: .
        run: |
          docker run --detach --name enterprise-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          python - <<'PY'
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://localhost:9000/minio/health/live", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY

      - name: Apply real PostgreSQL migrations
        run: |
          python scripts/verify_migration_topology.py
          alembic upgrade head
          alembic current
          alembic check

      - name: Start and verify a real Celery worker
        run: |
          celery -A app.infrastructure.processing.celery_app:celery_app worker \
            --detach \
            --hostname='enterprise-ci@%h' \
            --pool=prefork \
            --concurrency=2 \
            --queues=enterprise-ci \
            --pidfile=/tmp/passdetection-enterprise-ci.pid \
            --logfile=/tmp/passdetection-enterprise-ci.log
          python - <<'PY'
          import socket
          import time
          from app.infrastructure.processing.celery_app import celery_app

          destination = f"enterprise-ci@{socket.gethostname()}"
          for attempt in range(30):
              replies = celery_app.control.ping(timeout=1, destination=[destination])
              if replies:
                  break
              if attempt == 29:
                  raise RuntimeError("Celery worker did not answer control ping")
              time.sleep(1)
          PY

      - name: Run focused real-service contracts
        run: >-
          pytest -o addopts='' -m service_integration
          tests/service_integration

      - name: Preserve Celery log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-service-integration-celery-${{ github.sha }}
          path: /tmp/passdetection-enterprise-ci.log
          if-no-files-found: ignore
          retention-days: 7

  # Populated previous-release rehearsal. This proves the reviewed migration
  # and logical backup/restore contract against an isolated PostgreSQL service;
  # it is not evidence of production HA, PITR, or regional failover.
  backend-migration-rehearsal:
    name: Backend - Populated PostgreSQL Restore & Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-static-checks
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-migration-rehearsal-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: synthetic-ci-access
      S3_SECRET_ACCESS_KEY: synthetic-ci-secret
      JWT_ALGORITHM: HS256
      MIGRATION_REHEARSAL_ALLOW_EPHEMERAL_DATABASE_DELETION: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend and matching PostgreSQL 16 clients
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes -r requirements.lock
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pg_dump --version
          pg_restore --version

      - name: Rehearse populated 0085 dump, restore, and upgrade to head
        run: >-
          python scripts/rehearse_postgresql_upgrade.py
          --evidence-output migration-rehearsal-evidence.json

      - name: Preserve migration rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-migration-rehearsal-${{ github.sha }}
          path: backend/migration-rehearsal-evidence.json
          if-no-files-found: error
          retention-days: 30

  # ── Frontend: Lint & Type Check ─────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: React interaction tests and coverage floors
        run: npm run test:unit:coverage

      - name: Enforce frontend size and complexity budgets
        run: npm run maintainability:check

      - name: Node contract and regression tests
        run: >-
          find . -type f -name '*.test.mjs'
          -not -path './node_modules/*'
          -not -path './.next/*'
          -print0 | sort -z | xargs -0 node --test --test-reporter=dot

      - name: Generate frontend dependency SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > frontend-sbom.cdx.json

      - name: Preserve frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-javascript-sbom-${{ github.sha }}
          path: frontend/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Docker Build Verification ───────────────────────────────────────────────
  # Browser journeys stay separate from static checks so failures retain their
  # traces and screenshots without obscuring lint or unit-test feedback.
  frontend-browser:
    name: Frontend - Browser Journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the reviewed Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run rendered authentication, authorization, recovery, and workspace journeys
        run: npm run test:e2e

      - name: Preserve browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-browser-evidence-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs:
      - backend-dependency-audit
      - backend-test
      - backend-service-integration
      - backend-migration-rehearsal
      - frontend-lint
      - frontend-browser

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify Compose runtime separation
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          python scripts/verify_compose_runtime.py

      - name: Validate k6 harness syntax
        run: |
          node --check load-tests/k6/passport-extraction.js
          node --check load-tests/k6/dashboard-load-contract.mjs
          node --check load-tests/k6/dashboard-load.js
          node --check load-tests/k6/mobile-load-contract.mjs
          node --check load-tests/k6/mobile-attendance-load-contract.mjs
          node --check load-tests/k6/mobile-api.js
          node --check load-tests/k6/mobile-realtime.js
          node --check load-tests/k6/mobile-attendance.js
          node --test load-tests/k6/dashboard-load-contract.test.mjs load-tests/k6/mobile-load-contract.test.mjs load-tests/k6/mobile-attendance-load-contract.test.mjs

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          push: false
          tags: passdetection-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: false
          tags: passdetection-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
