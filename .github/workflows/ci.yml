name: CI — PassDetection Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: Lint & Compile Check ───────────────────────────────────────────
  backend-static-checks:
    name: Backend — Lint & Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install ruff==0.16.0 uv==0.12.0

      - name: Verify hash-locked production dependencies
        run: |
          uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Install hash-locked backend runtime
        run: pip install --require-hashes -r requirements.lock

      - name: Ruff lint
        run: ruff check --no-fix app tests

      - name: Python compile check
        run: python -m compileall -q app tests alembic scripts

      - name: Verify one reviewed Alembic head
        run: python scripts/verify_migration_topology.py

      - name: Enforce backend size and complexity ratchets
        run: python scripts/verify_backend_quality_budgets.py

      - name: Verify CI supply-chain policy
        run: python ../scripts/verify_ci_supply_chain.py

      - name: Verify release, storage, identity, resource and evidence safety contracts
        run: |
          python ../scripts/release_manifest.py
          python -m unittest discover -s ../scripts -p 'test_*.py'

  backend-dependency-audit:
    name: Backend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependency auditor
        run: |
          python -m pip install pip==26.2.1
          pip install pip-audit==2.10.1

      - name: Audit backend dependencies
        # pyattest 1.0.5 declares python-jose/ecdsa even though its published
        # verifier source does not import either package. The upstream ecdsa
        # advisory affects signing/keygen/ECDH; this service performs none of
        # those operations. Keep this one exact reviewed exception visible.
        run: >-
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-1325

      - name: Generate backend dependency SBOM
        run: >-
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-1325
          --format cyclonedx-json --output backend-sbom.cdx.json

      - name: Preserve backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-python-sbom-${{ github.sha }}
          path: backend/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Backend: Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    # The complete suite includes coverage over 2,000+ tests and can exceed
    # 30 minutes on a cold GitHub-hosted runner.
    timeout-minutes: 60
    needs: backend-static-checks
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: test-access-key
      S3_SECRET_ACCESS_KEY: test-secret-key
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==5.0.0 httpx==0.27.0 mypy==2.3.0

      - name: Apply database migrations
        run: |
          python scripts/verify_migration_topology.py
          alembic upgrade head
          alembic current
          alembic check

      - name: Verify backend-to-mobile OpenAPI contract
        run: python scripts/export_mobile_openapi_contract.py

      - name: Enforce strict backend typing
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-branch --cov-report=xml

      - name: Enforce critical-module coverage floors
        run: >-
          python scripts/verify_backend_quality_budgets.py
          --coverage-file coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          # Coverage reporting is diagnostic; an unenrolled/unavailable external
          # Codecov repository must not hide successful tests or skip Docker builds.
          fail_ci_if_error: false
          files: backend/coverage.xml
          flags: backend

  # Focused production-semantics lane. Fast SQLite tests remain the primary
  # feedback loop; this proves boundaries SQLite and mocks cannot represent.
  backend-service-integration:
    name: Backend - PostgreSQL, Redis, Private S3 & Celery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-static-checks
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      RUN_SERVICE_INTEGRATION: "1"
      APP_ENV: development
      APP_SECRET_KEY: ci-service-integration-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      FCM_TEST_POSTGRES_DB: passdetection_ci_fcm
      FCM_TEST_KEEP_SCHEMA: "1"
      REALTIME_TEST_REDIS_URL: redis://gc-realtime-startup-test-ci:6379/15
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: enterprise-ci-access
      S3_SECRET_ACCESS_KEY: enterprise-ci-secret-key
      S3_BUCKET_NAME: passdetection-enterprise-ci
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==5.0.0

      - name: Name the disposable Redis target for guarded realtime tests
        run: |
          echo '127.0.0.1 gc-realtime-startup-test-ci' | sudo tee -a /etc/hosts
          python - <<'PY'
          import socket
          assert socket.gethostbyname("gc-realtime-startup-test-ci") == "127.0.0.1"
          PY

      - name: Start maintained private S3 service
        working-directory: .
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.storage_identity import storage_identity

          environment = dict(os.environ, OBJECT_STORAGE_ADMIN_ACCESS_KEY="ci-storage-administrator",
                             OBJECT_STORAGE_ADMIN_SECRET_KEY="ci-storage-admin-secret")
          path = Path("/tmp/enterprise-storage-identities.json")
          path.write_text(storage_identity(environment), encoding="utf-8")
          path.chmod(0o600)
          PY
          docker run --detach --name enterprise-object-storage \
            --publish 127.0.0.1:9000:9000 \
            --mount type=bind,source=/tmp/enterprise-storage-identities.json,target=/run/secrets/s3.json,readonly \
            chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 \
            -filer -filer.exposeDirectoryData=false -master.telemetry=false \
            -volume.max=0 -master.volumeSizeLimitMB=1024 \
            -s3 -s3.ip.bind=0.0.0.0 -s3.port=9000 -s3.config=/run/secrets/s3.json -s3.iam.config=/run/secrets/s3.json \
            -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0 \
            -s3.allowDeleteBucketNotEmpty=false -s3.autoCreateBucket=false
          python - <<'PY'
          import os
          import time
          import boto3
          from botocore.config import Config

          client = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT_URL"],
                                aws_access_key_id="ci-storage-administrator",
                                aws_secret_access_key="ci-storage-admin-secret",
                                config=Config(connect_timeout=2, read_timeout=3, retries={"max_attempts": 1}))
          for attempt in range(60):
              try:
                  client.list_buckets()
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          client.create_bucket(Bucket=os.environ["S3_BUCKET_NAME"])
          client.put_bucket_versioning(Bucket=os.environ["S3_BUCKET_NAME"], VersioningConfiguration={"Status": "Enabled"})
          PY

      - name: Apply real PostgreSQL migrations
        run: |
          python scripts/verify_migration_topology.py
          alembic upgrade head
          alembic current
          alembic check

      - name: Start and verify a real Celery worker
        run: |
          celery -A app.infrastructure.processing.celery_app:celery_app worker \
            --detach \
            --hostname='enterprise-ci@%h' \
            --pool=prefork \
            --concurrency=2 \
            --queues=enterprise-ci \
            --pidfile=/tmp/passdetection-enterprise-ci.pid \
            --logfile=/tmp/passdetection-enterprise-ci.log
          python - <<'PY'
          import socket
          import time
          from app.infrastructure.processing.celery_app import celery_app

          destination = f"enterprise-ci@{socket.gethostname()}"
          for attempt in range(30):
              replies = celery_app.control.ping(timeout=1, destination=[destination])
              if replies:
                  break
              if attempt == 29:
                  raise RuntimeError("Celery worker did not answer control ping")
              time.sleep(1)
          PY

      - name: Create explicitly isolated mobile transaction database
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              name = os.environ["FCM_TEST_POSTGRES_DB"]
              assert name == "passdetection_ci_fcm" and name != os.environ["POSTGRES_DB"]
              connection = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"], port=int(os.environ["POSTGRES_PORT"]),
                  user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
                  database=os.environ["POSTGRES_DB"],
              )
              try:
                  await connection.execute('CREATE DATABASE passdetection_ci_fcm')
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Run focused real-service contracts
        run: |
          pytest -o addopts='' -m service_integration --junitxml=service-integration.xml tests/service_integration
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("service-integration.xml").getroot().iter("testcase"))
          assert cases, "The real-service lane collected no tests"
          skipped = [case.attrib.get("name") for case in cases if case.find("skipped") is not None]
          assert not skipped, f"Real-service prerequisites must be configured; skipped tests: {skipped}"
          print(f"All {len(cases)} real-service tests executed without skips")
          PY

      - name: Qualify separate database identities and protected privileges
        env:
          POSTGRES_RUNTIME_USER: ci_roles_runtime
          POSTGRES_RUNTIME_PASSWORD: "ci-runtime:密碼/@%?#[]-2026-qualification!"
          POSTGRES_MIGRATION_USER: ci_roles_migrator
          POSTGRES_MIGRATION_PASSWORD: ci-migrator-2026-qualification-password
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"], port=int(os.environ["POSTGRES_PORT"]),
                  user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
                  database=os.environ["POSTGRES_DB"],
              )
              try:
                  # Deliberately fail if this disposable target already exists.
                  await connection.execute('CREATE DATABASE passdetection_ci_roles')
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
          export POSTGRES_DB=passdetection_ci_roles
          alembic upgrade head
          python scripts/qualify_database_roles.py

      - name: Preserve Celery log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-service-integration-celery-${{ github.sha }}
          path: /tmp/passdetection-enterprise-ci.log
          if-no-files-found: ignore
          retention-days: 7

  # Populated previous-release rehearsal. This proves the reviewed migration
  # and logical backup/restore contract against an isolated PostgreSQL service;
  # it is not evidence of production HA, PITR, or regional failover.
  backend-migration-rehearsal:
    name: Backend - Populated PostgreSQL Restore & Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-static-checks
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-migration-rehearsal-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: synthetic-ci-access
      S3_SECRET_ACCESS_KEY: synthetic-ci-secret
      JWT_ALGORITHM: HS256
      MIGRATION_REHEARSAL_ALLOW_EPHEMERAL_DATABASE_DELETION: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend and matching PostgreSQL 16 clients
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes -r requirements.lock
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pg_dump --version
          pg_restore --version

      - name: Rehearse populated 0085 dump, restore, and upgrade to head
        run: >-
          python scripts/rehearse_postgresql_upgrade.py
          --evidence-output migration-rehearsal-evidence.json

      - name: Preserve migration rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-migration-rehearsal-${{ github.sha }}
          path: backend/migration-rehearsal-evidence.json
          if-no-files-found: error
          retention-days: 30

  # ── Frontend: Lint & Type Check ─────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: React interaction tests and coverage floors
        run: npm run test:unit:coverage

      - name: Enforce frontend size and complexity budgets
        run: npm run maintainability:check

      - name: Node contract and regression tests
        run: >-
          find . -type f -name '*.test.mjs'
          -not -path './node_modules/*'
          -not -path './.next/*'
          -print0 | sort -z | xargs -0 node --test --test-reporter=dot

      - name: Generate frontend dependency SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > frontend-sbom.cdx.json

      - name: Preserve frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-javascript-sbom-${{ github.sha }}
          path: frontend/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Docker Build Verification ───────────────────────────────────────────────
  # Browser journeys stay separate from static checks so failures retain their
  # traces and screenshots without obscuring lint or unit-test feedback.
  frontend-browser:
    name: Frontend - Browser Journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the reviewed Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run rendered authentication, authorization, recovery, and workspace journeys
        run: npm run test:e2e

      - name: Preserve browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-browser-evidence-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs:
      - backend-dependency-audit
      - backend-test
      - backend-service-integration
      - backend-migration-rehearsal
      - frontend-lint
      - frontend-browser

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify Compose runtime separation
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          python scripts/verify_compose_runtime.py

      - name: Validate k6 harness syntax
        run: |
          node --check load-tests/k6/passport-extraction.js
          node --check load-tests/k6/dashboard-load-contract.mjs
          node --check load-tests/k6/dashboard-load.js
          node --check load-tests/k6/mobile-load-contract.mjs
          node --check load-tests/k6/mobile-attendance-load-contract.mjs
          node --check load-tests/k6/mobile-api.js
          node --check load-tests/k6/mobile-realtime.js
          node --check load-tests/k6/mobile-attendance.js
          node --test load-tests/k6/dashboard-load-contract.test.mjs load-tests/k6/mobile-load-contract.test.mjs load-tests/k6/mobile-attendance-load-contract.test.mjs

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            passdetection-backend:ci
            passdetection-qualification-backend:local
          build-args: |
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            passdetection-frontend:ci
            passdetection-qualification-frontend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up qualification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up qualification Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare isolated production-image stack
        run: |
          pip install cryptography==50.0.0
          python scripts/qa/prepare_qualification_certificate.py
          python scripts/qa/run_qualification_stack.py start

      - name: Qualify real TLS cookies, MFA, CSRF and sessions in three engines
        working-directory: frontend
        env:
          RUN_REAL_STACK: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test --config=playwright.real-stack.config.ts

      - name: Validate operational alert firing and recovery
        run: >-
          docker run --rm --entrypoint /bin/promtool
          --mount type=bind,source=${{ github.workspace }}/monitoring,target=/work,readonly
          -w /work
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          test rules alerts.test.yml

      - name: Qualify private uploads, audit persistence and worker recovery
        run: python scripts/qa/qualify_joined_journeys.py

      - name: Restore current synthetic schema and a versioned object
        run: python scripts/qa/qualify_synthetic_recovery.py

      - name: Qualify versioned storage migration and failure guards
        run: python scripts/qa/run_storage_migration_qualification.py

      - name: Capture isolated runtime evidence
        if: ${{ always() }}
        run: python scripts/qa/run_qualification_stack.py evidence

      - name: Preserve joined-system qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-qualification-${{ github.sha }}
          path: |
            outputs/qualification/*.log
            outputs/qualification/recovery-evidence.json
            outputs/qualification/joined-journey-evidence.json
            outputs/qualification/source-evidence.json
            outputs/storage-migration-ci/qualification.log
            outputs/storage-migration-ci/migration-evidence.json
            frontend/real-stack-report
            frontend/real-stack-results
          if-no-files-found: warn
          retention-days: 30

      - name: Remove only disposable qualification services and volumes
        if: ${{ always() }}
        run: python scripts/qa/run_qualification_stack.py stop
