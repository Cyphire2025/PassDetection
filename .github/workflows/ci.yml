name: CI/CD — PassDetection Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Full deploy promotes tested images to the VPS; none runs checks only"
        required: true
        default: full
        type: choice
        options:
          - full
          - none
      expected_revision:
        description: "Optional exact commit selected by the release operator"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Backend: Lint & Compile Check ───────────────────────────────────────────
  backend-static-checks:
    name: Backend — Lint & Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bind a manually selected release to its exact revision
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          if [ -n "$EXPECTED_REVISION" ] && [ "$EXPECTED_REVISION" != "$SOURCE_REVISION" ]; then
            echo "The selected commit is no longer the dispatched main revision. Select again."
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python ../scripts/bootstrap_backend.py --check

      - name: Verify hash-locked production dependencies
        run: |
          uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes --output-file requirements.lock
          uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes --output-file requirements-dev.lock
          uv pip compile requirements-image-build.in --universal --python-version 3.11 --generate-hashes --output-file requirements-image-build.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock requirements-image-build.lock

      - name: Install hash-locked backend runtime
        run: pip install --require-hashes -r requirements.lock

      - name: Ruff lint
        run: ruff check --no-fix app tests

      - name: Python compile check
        run: python -m compileall -q app tests alembic scripts

      - name: Verify one reviewed Alembic head
        run: python scripts/verify_migration_topology.py

      - name: Enforce backend size and complexity ratchets
        run: python scripts/verify_backend_quality_budgets.py

      - name: Verify pragmatic monolith dependency boundaries
        run: python scripts/verify_architecture_boundaries.py

      - name: Verify accountable documentation claims
        run: python ../scripts/verify_documentation_claims.py

      - name: Require reviewed MCP workflow coverage classifications
        run: python ../scripts/mcp_inventory.py --check

      - name: Verify CI supply-chain policy
        run: python ../scripts/verify_ci_supply_chain.py

      - name: Verify release, storage, identity, resource and evidence safety contracts
        run: |
          python ../scripts/release_manifest.py
          python -m unittest discover -s ../scripts -p 'test_*.py'

      - name: Verify combined MCP and website capacity harness contracts
        working-directory: scripts/qa
        run: python -m unittest test_workload_capacity test_mcp_capacity test_capacity_container_events

  connector-windows:
    name: MCP Connector — Windows Tests & Wheel
    runs-on: windows-latest
    needs: backend-static-checks
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # CPython 3.11 security releases have no official Windows installer.
      # Use the same pinned managed build as the supported Windows developer setup.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.0"
          python-version: "3.11.15"
          enable-cache: true
      - name: Create the pinned Windows Python environment
        run: |
          uv venv --python 3.11.15 --seed .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install hash-locked test and package dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r backend/requirements-image-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r mcp-connector/requirements.lock
      - name: Check the connector runtime lock without resolving new versions
        run: |
          uv pip compile mcp-connector/requirements.txt --constraint backend/requirements.lock --universal --python-version 3.11 --generate-hashes --output-file mcp-connector/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- mcp-connector/requirements.lock
      - name: Verify bounded transfers, OAuth proxy and official SDK transport
        working-directory: mcp-connector
        run: |
          python -m ruff check --no-fix src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the connector using hash-locked build tools
        working-directory: mcp-connector
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Verify the installed wheel entrypoint outside the source import path
        run: |
          $connectorWheel = Get-ChildItem -LiteralPath mcp-connector/dist -Filter '*.whl'
          if ($connectorWheel.Count -ne 1) { throw 'Expected exactly one connector wheel' }
          python -m pip install --no-deps $connectorWheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gc-mcp --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gc-mcp --help
      - name: Package exact wheel, runtime lock and instructions
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/release_connector.py package --revision $env:SOURCE_REVISION --directory outputs/connector
      - name: Attest connector inventory on main
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: outputs/connector/connector-artifacts.json
      - name: Retain qualified connector assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-connector-${{ github.sha }}
          path: outputs/connector
          if-no-files-found: error
          retention-days: 30

  backend-dependency-audit:
    name: Backend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependency auditor
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Validate expiring advisory exception and audit the complete runtime lock
        run: python ../scripts/audit_backend_dependencies.py

      - name: Generate backend dependency SBOM under the same exception gate
        run: python ../scripts/audit_backend_dependencies.py --sbom backend-sbom.cdx.json

      - name: Preserve backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-python-sbom-${{ github.sha }}
          path: backend/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Backend: Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    # Keep all 6,900+ tests and combine coverage from four isolated processes.
    # File scheduling preserves module fixtures; real-service tests run below.
    timeout-minutes: 60
    needs: backend-static-checks
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: test-access-key
      S3_SECRET_ACCESS_KEY: test-secret-key
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Apply database migrations
        run: |
          python scripts/verify_migration_topology.py
          alembic upgrade head
          alembic current
          alembic check

      - name: Verify complete reviewed backend OpenAPI contract
        run: python scripts/export_api_contract.py

      - name: Verify backend-to-mobile OpenAPI contract
        run: python scripts/export_mobile_openapi_contract.py

      - name: Enforce strict backend typing
        run: mypy app

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          pytest -n 4 --dist loadfile --max-worker-restart=0
          -o faulthandler_timeout=120 --durations=25
          --cov=app --cov-branch --cov-report=xml

      - name: Enforce critical-module coverage floors
        run: >-
          python scripts/verify_backend_quality_budgets.py
          --coverage-file coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          # Coverage reporting is diagnostic; an unenrolled/unavailable external
          # Codecov repository must not hide successful tests or skip Docker builds.
          fail_ci_if_error: false
          files: backend/coverage.xml
          flags: backend

  # Focused production-semantics lane. Fast SQLite tests remain the primary
  # feedback loop; this proves boundaries SQLite and mocks cannot represent.
  backend-service-integration:
    name: Backend - PostgreSQL, Redis, Private S3 & Celery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-static-checks
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: passdetection_ci_services
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d passdetection_ci_services"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      RUN_SERVICE_INTEGRATION: "1"
      AUDIT_TEST_S3_ENDPOINT: http://127.0.0.1:9010
      AUDIT_TEST_S3_ACCESS_KEY_ID: synthetic-audit-admin
      AUDIT_TEST_S3_SECRET_ACCESS_KEY: synthetic-audit-qualification-password
      APP_ENV: development
      APP_SECRET_KEY: ci-service-integration-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: passdetection_ci_services
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      FCM_TEST_POSTGRES_DB: passdetection_ci_fcm
      FCM_TEST_KEEP_SCHEMA: "1"
      REALTIME_TEST_REDIS_URL: redis://gc-realtime-startup-test-ci:6379/15
      CI_FRONTEND_ERROR_REDIS_URL: redis://localhost:6379/14
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: enterprise-ci-access
      S3_SECRET_ACCESS_KEY: enterprise-ci-secret-key
      S3_BUCKET_NAME: passdetection-enterprise-ci
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Start isolated immutable audit storage
        run: |
          docker run -d --name audit-storage --publish 127.0.0.1:9010:9000 \
            --tmpfs /data:uid=10001,gid=10001,size=256m --tmpfs /logs:uid=10001,gid=10001,size=64m \
            --env RUSTFS_ACCESS_KEY=synthetic-audit-admin \
            --env RUSTFS_SECRET_KEY=synthetic-audit-qualification-password \
            --env RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs@sha256:ba0a1b53e36f321c0d46f3867104abef169f7bc59c467c664ddac87e7ddc9a8b
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:9010/health", timeout=2) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          PY

      - name: Name the disposable Redis target for guarded realtime tests
        run: |
          echo '127.0.0.1 gc-realtime-startup-test-ci' | sudo tee -a /etc/hosts
          python - <<'PY'
          import socket
          assert socket.gethostbyname("gc-realtime-startup-test-ci") == "127.0.0.1"
          PY

      - name: Start maintained private S3 service
        working-directory: .
        env:
          CI_STORAGE_IMAGE: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
        run: |
          storage_failure() {
            { docker inspect --format '{{json .State}}' enterprise-object-storage || true; docker logs --tail 200 enterprise-object-storage || true; } > /tmp/passdetection-enterprise-storage.log 2>&1
            cat /tmp/passdetection-enterprise-storage.log
          }
          trap storage_failure ERR
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.storage_identity import storage_identity
          from scripts.qa.qualification_storage_identity import write_qualification_identity

          environment = dict(os.environ, OBJECT_STORAGE_ADMIN_ACCESS_KEY="ci-storage-administrator",
                             OBJECT_STORAGE_ADMIN_SECRET_KEY="ci-storage-admin-secret")
          path = Path("/tmp/passdetection-enterprise-storage/identities.json")
          write_qualification_identity(path, storage_identity(environment), os.environ["CI_STORAGE_IMAGE"])
          PY
          docker run --detach --name enterprise-object-storage \
            --publish 127.0.0.1:9000:9000 \
            --mount type=bind,source=/tmp/passdetection-enterprise-storage/identities.json,target=/run/secrets/s3.json,readonly \
            "$CI_STORAGE_IMAGE" \
            server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 \
            -filer -filer.exposeDirectoryData=false -master.telemetry=false \
            -volume.max=0 -master.volumeSizeLimitMB=1024 \
            -s3 -s3.ip.bind=0.0.0.0 -s3.port=9000 -s3.config=/run/secrets/s3.json -s3.iam.config=/run/secrets/s3.json \
            -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0 \
            -s3.allowDeleteBucketNotEmpty=false -s3.autoCreateBucket=false
          python - <<'PY'
          import os
          import json
          import subprocess
          import time
          import boto3
          from botocore.config import Config

          client = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT_URL"],
                                aws_access_key_id="ci-storage-administrator",
                                aws_secret_access_key="ci-storage-admin-secret",
                                config=Config(connect_timeout=2, read_timeout=3, retries={"max_attempts": 1}))
          for attempt in range(60):
              state = json.loads(subprocess.check_output(["docker", "inspect", "--format", "{{json .State}}", "enterprise-object-storage"], text=True))
              if not state["Running"]:
                  raise RuntimeError(f"Private S3 exited before readiness: {state}")
              try:
                  client.list_buckets()
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          client.create_bucket(Bucket=os.environ["S3_BUCKET_NAME"])
          client.put_bucket_versioning(Bucket=os.environ["S3_BUCKET_NAME"], VersioningConfiguration={"Status": "Enabled"})
          PY

      - name: Apply real PostgreSQL migrations
        run: |
          python scripts/verify_migration_topology.py
          alembic upgrade head
          alembic current
          alembic check

      - name: Start and verify a real Celery worker
        run: |
          celery -A app.infrastructure.processing.celery_app:celery_app worker \
            --detach \
            --hostname='enterprise-ci@%h' \
            --pool=prefork \
            --concurrency=2 \
            --queues=enterprise-ci \
            --pidfile=/tmp/passdetection-enterprise-ci.pid \
            --logfile=/tmp/passdetection-enterprise-ci.log
          python - <<'PY'
          import socket
          import time
          from app.infrastructure.processing.celery_app import celery_app

          destination = f"enterprise-ci@{socket.gethostname()}"
          for attempt in range(30):
              replies = celery_app.control.ping(timeout=1, destination=[destination])
              if replies:
                  break
              if attempt == 29:
                  raise RuntimeError("Celery worker did not answer control ping")
              time.sleep(1)
          PY

      - name: Create explicitly isolated mobile transaction database
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              name = os.environ["FCM_TEST_POSTGRES_DB"]
              assert name == "passdetection_ci_fcm" and name != os.environ["POSTGRES_DB"]
              connection = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"], port=int(os.environ["POSTGRES_PORT"]),
                  user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
                  database=os.environ["POSTGRES_DB"],
              )
              try:
                  await connection.execute('CREATE DATABASE passdetection_ci_fcm')
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Run focused real-service contracts
        run: |
          pytest -o addopts='' -m service_integration --junitxml=service-integration.xml tests/service_integration
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("service-integration.xml").getroot().iter("testcase"))
          assert cases, "The real-service lane collected no tests"
          skipped = [case.attrib.get("name") for case in cases if case.find("skipped") is not None]
          assert not skipped, f"Real-service prerequisites must be configured; skipped tests: {skipped}"
          print(f"All {len(cases)} real-service tests executed without skips")
          PY

      - name: Qualify separate database identities and protected privileges
        env:
          POSTGRES_RUNTIME_USER: ci_roles_runtime
          POSTGRES_RUNTIME_PASSWORD: "ci-runtime:密碼/@%?#[]-2026-qualification!"
          POSTGRES_MIGRATION_USER: ci_roles_migrator
          POSTGRES_MIGRATION_PASSWORD: ci-migrator-2026-qualification-password
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"], port=int(os.environ["POSTGRES_PORT"]),
                  user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
                  database=os.environ["POSTGRES_DB"],
              )
              try:
                  # Deliberately fail if this disposable target already exists.
                  await connection.execute('CREATE DATABASE passdetection_ci_roles')
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
          export POSTGRES_DB=passdetection_ci_roles
          alembic upgrade head
          python scripts/qualify_database_roles.py

      - name: Verify an approved replica pool envelope on real PostgreSQL
        env:
          CAPACITY_PG_USER: test_user
          CAPACITY_PG_PASSWORD: test_password
        run: |
          python - <<'PY'
          import os, psycopg2
          connection = psycopg2.connect(host='127.0.0.1', port=5432, dbname='postgres', user=os.environ['CAPACITY_PG_USER'], password=os.environ['CAPACITY_PG_PASSWORD'])
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute('CREATE DATABASE passdetection_ci_capacity')
          connection.close()
          PY
          python ../scripts/qa/qualify_database_capacity.py --port 5432 --database passdetection_ci_capacity --output ../outputs/database-capacity-ci.json

      - name: Preserve service startup and Celery logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-service-integration-celery-${{ github.sha }}
          path: |
            /tmp/passdetection-enterprise-ci.log
            /tmp/passdetection-enterprise-storage.log
          if-no-files-found: ignore
          retention-days: 7

  # Populated previous-release rehearsal. This proves the reviewed migration
  # and logical backup/restore contract against an isolated PostgreSQL service;
  # it is not evidence of production HA, PITR, or regional failover.
  backend-migration-rehearsal:
    name: Backend - Populated PostgreSQL Restore & Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-static-checks
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-migration-rehearsal-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: synthetic-ci-access
      S3_SECRET_ACCESS_KEY: synthetic-ci-secret
      JWT_ALGORITHM: HS256
      MIGRATION_REHEARSAL_ALLOW_EPHEMERAL_DATABASE_DELETION: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend and matching PostgreSQL 16 clients
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pg_dump --version
          pg_restore --version

      - name: Rehearse populated 0085 dump, restore, and upgrade to head
        run: >-
          python scripts/rehearse_postgresql_upgrade.py
          --evidence-output migration-rehearsal-evidence.json

      - name: Preserve migration rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-migration-rehearsal-${{ github.sha }}
          path: backend/migration-rehearsal-evidence.json
          if-no-files-found: error
          retention-days: 30

  # ── Frontend: Lint & Type Check ─────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Enforce dashboard developer toolchain
        run: |
          npm install --global npm@11.20.0
          node scripts/patch-npm-toolchain.mjs "$(npm root --global)/npm"
          python ../scripts/check_node_toolchain.py

      - name: Install dependencies
        run: npm ci

      - name: Inventory and audit the maintained npm installer itself
        run: |
          python ../scripts/inventory_npm_toolchain.py --npm-root "$(npm root --global)/npm" --output ../outputs/npm-toolchain.purls
          docker run --rm --mount type=bind,source=${{ github.workspace }}/outputs,target=/evidence \
            anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3 \
            purl:/evidence/npm-toolchain.purls --fail-on high -o json --file /evidence/npm-toolchain.grype.json

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: React interaction tests and coverage floors
        run: npm run test:unit:coverage

      - name: Enforce frontend size and complexity budgets
        run: npm run maintainability:check

      - name: Node contract and regression tests
        run: >-
          find . -type f -name '*.test.mjs'
          -not -path '*/node_modules/*'
          -not -path './.next/*'
          -print0 | sort -z | xargs -0 node --test --test-reporter=dot

      - name: Generate frontend dependency SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > frontend-sbom.cdx.json

      - name: Preserve frontend SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-javascript-sbom-${{ github.sha }}
          path: |
            frontend/frontend-sbom.cdx.json
            outputs/npm-toolchain.*
          if-no-files-found: warn
          retention-days: 30

  # ── Docker Build Verification ───────────────────────────────────────────────
  # Browser journeys stay separate from static checks so failures retain their
  # traces and screenshots without obscuring lint or unit-test feedback.
  frontend-browser:
    name: Frontend - Browser Journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Enforce dashboard developer toolchain
        run: |
          npm install --global npm@11.20.0
          node scripts/patch-npm-toolchain.mjs "$(npm root --global)/npm"
          python ../scripts/check_node_toolchain.py

      - name: Install dependencies
        run: npm ci

      - name: Install the reviewed Chromium and WebKit runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Verify synthetic camera lifecycle before expensive image builds
        run: npx playwright test --config=playwright.fixtures.config.ts

      - name: Run rendered authentication, authorization, recovery, and workspace journeys
        run: npm run test:e2e

      - name: Preserve browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-browser-evidence-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/fixture-results
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs:
      - backend-dependency-audit
      - backend-test
      - backend-service-integration
      - backend-migration-rehearsal
      - frontend-lint
      - frontend-browser
      - connector-windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify Compose runtime separation
        run: python scripts/verify_compose_runtime.py

      - name: Validate k6 harness syntax
        run: |
          node --check load-tests/k6/passport-extraction.js
          node --check load-tests/k6/dashboard-load-contract.mjs
          node --check load-tests/k6/dashboard-load.js
          node --check load-tests/k6/mobile-load-contract.mjs
          node --check load-tests/k6/mobile-attendance-load-contract.mjs
          node --check load-tests/k6/mobile-api.js
          node --check load-tests/k6/mobile-realtime.js
          node --check load-tests/k6/mobile-attendance.js
          node --test load-tests/k6/dashboard-load-contract.test.mjs load-tests/k6/mobile-load-contract.test.mjs load-tests/k6/mobile-attendance-load-contract.test.mjs

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            passdetection-backend:ci
            passdetection-qualification-backend:local
          build-args: |
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            passdetection-frontend:ci
            passdetection-qualification-frontend:local
          build-args: |
            APP_REVISION=${{ github.sha }}
            NEXT_PUBLIC_APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Set up qualification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"

      - name: Set up qualification Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Enforce maintained qualification installer
        run: |
          npm install --global npm@11.20.0
          node frontend/scripts/patch-npm-toolchain.mjs "$(npm root --global)/npm"
          python scripts/check_node_toolchain.py

      - name: Qualify bounded native and reused-worker memory before starting other services
        run: |
          FINAL_IMAGE=$(docker image inspect --format '{{.Id}}' passdetection-backend:ci)
          python scripts/qa/qualify_bounded_memory.py --image "$FINAL_IMAGE" --memory 384m --repetitions 10 --modes email gemini-extraction gemini-verification
          python scripts/qa/qualify_bounded_memory.py --image "$FINAL_IMAGE" --memory 512m --repetitions 10 --modes visa-image
          python scripts/qa/qualify_bounded_memory.py --image "$FINAL_IMAGE" --memory 640m --repetitions 10 --modes ecr-single
          python scripts/qa/qualify_api_native_memory.py --image "$FINAL_IMAGE"

      - name: Prepare isolated production-image stack
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python scripts/qa/prepare_qualification_certificate.py
          python scripts/qa/run_qualification_stack.py start

      - name: Qualify real TLS cookies, MFA, CSRF and sessions in three engines
        working-directory: frontend
        env:
          RUN_REAL_STACK: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test --config=playwright.real-stack.config.ts

      - name: Validate operational alert firing and recovery
        run: >-
          docker run --rm --entrypoint /bin/promtool
          --mount type=bind,source=${{ github.workspace }}/monitoring,target=/work,readonly
          -w /work
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          test rules alerts.test.yml

      - name: Qualify private uploads, audit persistence and worker recovery
        run: python scripts/qa/qualify_joined_journeys.py

      - name: Qualify shared authorization and accepted uploads across API restart
        run: python scripts/qa/qualify_api_replica_recovery.py

      - name: Qualify preserved data and fail-closed authorization during database interruption
        run: python scripts/qa/qualify_dependency_recovery.py

      - name: Qualify runtime OCR, image processing and PDF without video decoders
        run: >-
          docker run --rm --mount type=bind,source=${{ github.workspace }}/scripts/qa/qualify_runtime_image.py,target=/qa.py,readonly
          passdetection-backend:ci python /qa.py --require-no-video --require-patched-parsers

      - name: Qualify proxy error contracts using the pinned runtime image
        run: |
          NGINX_IMAGE=$(docker image inspect --format '{{.Id}}' nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46)
          python scripts/qa/qualify_proxy_errors.py --image "$NGINX_IMAGE"

      - name: Qualify serving release switches with in-flight requests and failed proxy configuration
        run: |
          NGINX_IMAGE=$(docker image inspect --format '{{.Id}}' nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46)
          BACKEND_IMAGE=$(docker image inspect --format '{{.Id}}' passdetection-backend:ci)
          python scripts/qa/qualify_code_update_nginx.py --image "$NGINX_IMAGE" --python-image "$BACKEND_IMAGE"

      - name: Restore current synthetic schema and a versioned object
        run: python scripts/qa/qualify_synthetic_recovery.py

      - name: Qualify versioned storage migration and failure guards
        run: python scripts/qa/run_storage_migration_qualification.py

      - name: Qualify retained image retrieval and identity refusals
        run: python scripts/qa/qualify_artifact_retrieval.py

      - name: Qualify parallel project and replica naming with preserved synthetic data
        run: python scripts/qa/qualify_compose_project_isolation.py

      - name: Prepare full-image evidence directory
        run: mkdir -p outputs/promoted

      - name: Inventory complete backend image including OS packages
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: passdetection-backend:ci
          format: spdx-json
          output-file: outputs/promoted/backend.spdx.json
          upload-artifact: false
          syft-version: v1.52.0

      - name: Scan complete backend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: passdetection-backend:ci
          grype-version: v0.119.0
          output-format: json
          output-file: outputs/promoted/backend.grype.json
          # Collection is separate from policy evaluation. The next required step
          # rejects unknown matches; reviewed exact matches require live byte,
          # parser, native-symbol, expiry and deployment-isolation checks.
          fail-build: false
          only-fixed: false

      - name: Enforce backend whole-image vulnerability policy
        run: >-
          python scripts/audit_backend_dependencies.py
          --image-report outputs/promoted/backend.grype.json --image passdetection-backend:ci
          --image-receipt outputs/promoted/backend-advisory-conditions.json

      - name: Inventory complete frontend image including OS packages
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: passdetection-frontend:ci
          format: spdx-json
          output-file: outputs/promoted/frontend.spdx.json
          upload-artifact: false
          syft-version: v1.52.0

      - name: Scan complete frontend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: outputs/promoted/frontend.spdx.json
          grype-version: v0.119.0
          output-format: json
          output-file: outputs/promoted/frontend.grype.json
          # Collection is separate from policy evaluation. The next required step
          # rejects every high/critical match except the guarded exact exception.
          fail-build: false
          only-fixed: false

      - name: Enforce frontend whole-image vulnerability policy
        run: python scripts/audit_backend_dependencies.py --image-report outputs/promoted/frontend.grype.json

      - name: Export the exact qualified images without rebuilding
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/release_artifacts.py export --revision "$SOURCE_REVISION" --directory outputs/promoted

      - name: Sign qualified archive and full-image SBOM checksums
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: outputs/promoted/qualified-images.json

      - name: Retain exact qualified image archives for promotion
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-images-${{ github.sha }}
          path: outputs/promoted
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Capture isolated runtime evidence
        if: ${{ always() }}
        run: python scripts/qa/run_qualification_stack.py evidence

      - name: Preserve full-image inventory and vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-image-audit-${{ github.sha }}
          path: |
            outputs/promoted/*.spdx.json
            outputs/promoted/*.grype.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve joined-system qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-qualification-${{ github.sha }}
          path: |
            outputs/qualification/*.log
            outputs/qualification/recovery-evidence.json
            outputs/qualification/joined-journey-evidence.json
            outputs/qualification/source-evidence.json
            outputs/qualification/code-update-nginx-evidence.json
            outputs/storage-migration-ci/*.log
            outputs/storage-migration-ci/*-state.json
            outputs/storage-migration-ci/migration-evidence.json
            outputs/memory-qualification/**/evidence.json
            outputs/memory-qualification/**/*.log
            frontend/real-stack-report
            frontend/real-stack-results
          if-no-files-found: warn
          retention-days: 30

      - name: Remove only disposable qualification services and volumes
        if: ${{ always() }}
        run: python scripts/qa/run_qualification_stack.py stop

  publish-qualified-artifacts:
    name: Promote qualified image digests and signed inventory
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'full' && github.ref == 'refs/heads/main' }}
    needs: docker-build
    runs-on: ubuntu-latest
    environment: production-artifacts
    concurrency:
      group: production-artifacts-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-images-${{ github.sha }}
          path: outputs/promoted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-connector-${{ github.sha }}
          path: outputs/connector
      - name: Verify connector provenance and every retained byte
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/release_connector.py verify --revision "$SOURCE_REVISION" --directory outputs/connector
      - name: Verify signed qualification index and promote exact image bytes
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          SCHEMA=$(python -c "import json; print(json.load(open('backend/app/core/config/release_manifest.json'))['schema_revision'])")
          python scripts/release_artifacts.py promote --revision "$SOURCE_REVISION" --directory outputs/promoted --schema "$SCHEMA"
          python - <<'PY'
          import json, os
          manifest = json.load(open('outputs/promoted/release-artifacts.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for name, image in manifest['images'].items():
                  stream.write(f"{name}_name={image['reference'].split('@')[0]}\n{name}_digest={image['digest']}\n")
          PY
      - name: Attest backend image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.promote.outputs.backend_name }}
          subject-digest: ${{ steps.promote.outputs.backend_digest }}
          push-to-registry: true
      - name: Attest backend full-image SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.promote.outputs.backend_name }}
          subject-digest: ${{ steps.promote.outputs.backend_digest }}
          sbom-path: outputs/promoted/backend.spdx.json
          push-to-registry: true
      - name: Attest frontend image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.promote.outputs.frontend_name }}
          subject-digest: ${{ steps.promote.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest frontend full-image SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.promote.outputs.frontend_name }}
          subject-digest: ${{ steps.promote.outputs.frontend_digest }}
          sbom-path: outputs/promoted/frontend.spdx.json
          push-to-registry: true
      - name: Sign release inventory
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: outputs/promoted/release-artifacts.json
      - name: Verify published image provenance, SBOM and config readback
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/release_artifacts.py verify --revision "$SOURCE_REVISION" --directory outputs/promoted
      - name: Retain a separately retrievable release inventory
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          gh release create "release-$SOURCE_REVISION" --target "$SOURCE_REVISION"
          --title "Qualified artifacts $SOURCE_REVISION"
          --notes "Qualified immutable images, Windows connector and signed inventories. No deployment was performed. Interactive Codex sign-in remains a separate acceptance gate."
          outputs/promoted/release-artifacts.json
          outputs/promoted/backend.spdx.json outputs/promoted/frontend.spdx.json
          outputs/connector/connector-artifacts.json outputs/connector/*.whl
          outputs/connector/connector-requirements.lock outputs/connector/connector-README.md

  deploy-qualified-vps:
    name: Deploy signed release to production VPS
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'full' && github.ref == 'refs/heads/main' }}
    needs: publish-qualified-artifacts
    runs-on: ubuntu-latest
    environment: production-vps
    timeout-minutes: 50
    concurrency:
      group: production-vps
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Activate the exact qualified revision with retained recovery
        env:
          SOURCE_REVISION: ${{ github.sha }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_HOST"
          test "${#SOURCE_REVISION}" = 40
          umask 077
          KEY_FILE=$(mktemp)
          HOSTS_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE" "$HOSTS_FILE"' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$KEY_FILE"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOSTS_FILE"
          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOSTS_FILE" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=6 \
            "root@$VPS_HOST" "deploy-qualified:$SOURCE_REVISION"
