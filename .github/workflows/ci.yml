name: CI — PassDetection Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: Lint & Compile Check ───────────────────────────────────────────
  backend-static-checks:
    name: Backend — Lint & Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.1.2
          pip install ruff==0.16.0 uv==0.12.0

      - name: Verify hash-locked production dependencies
        run: |
          uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Ruff lint
        run: ruff check --no-fix app tests

      - name: Python compile check
        run: python -m compileall -q app tests alembic scripts

      - name: Verify CI supply-chain policy
        run: python ../scripts/verify_ci_supply_chain.py

  backend-dependency-audit:
    name: Backend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependency auditor
        run: |
          python -m pip install pip==26.1.2
          pip install pip-audit==2.10.1

      - name: Audit backend dependencies
        # python-jose installs ecdsa, but runtime configuration is constrained
        # and tested to HS256 so the ECDSA implementation is unreachable.
        run: >-
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-1325

      - name: Generate backend dependency SBOM
        run: >-
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-1325
          --format cyclonedx-json --output backend-sbom.cdx.json

      - name: Preserve backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-python-sbom-${{ github.sha }}
          path: backend/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Backend: Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend-static-checks
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY_ID: test-access-key
      S3_SECRET_ACCESS_KEY: test-secret-key
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.1.2
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==5.0.0 httpx==0.27.0

      - name: Apply database migrations
        run: |
          alembic heads
          alembic upgrade head
          alembic current

      - name: Verify backend-to-mobile OpenAPI contract
        run: python scripts/export_mobile_openapi_contract.py

      - name: Run tests
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          # Coverage reporting is diagnostic; an unenrolled/unavailable external
          # Codecov repository must not hide successful tests or skip Docker builds.
          fail_ci_if_error: false
          files: backend/coverage.xml
          flags: backend

  # ── Frontend: Lint & Type Check ─────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Node contract and regression tests
        run: >-
          find . -type f -name '*.test.mjs'
          -not -path './node_modules/*'
          -not -path './.next/*'
          -print0 | sort -z | xargs -0 node --test --test-reporter=dot

      - name: Generate frontend dependency SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > frontend-sbom.cdx.json

      - name: Preserve frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-javascript-sbom-${{ github.sha }}
          path: frontend/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Docker Build Verification ───────────────────────────────────────────────
  docker-build:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [backend-dependency-audit, backend-test, frontend-lint]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify Compose runtime separation
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          python scripts/verify_compose_runtime.py

      - name: Validate k6 harness syntax
        run: |
          node --check load-tests/k6/passport-extraction.js
          node --check load-tests/k6/mobile-load-contract.mjs
          node --check load-tests/k6/mobile-api.js
          node --check load-tests/k6/mobile-realtime.js
          node --test load-tests/k6/mobile-load-contract.test.mjs

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          push: false
          tags: passdetection-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: false
          tags: passdetection-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
