name: Coordinator WebView Shell CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Coordinators app/**"
      - ".github/workflows/coordinator-webview-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Coordinators app/**"
      - ".github/workflows/coordinator-webview-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Dependencies, tests, lint, and APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Coordinators app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve the reviewed production dependency graph
        run: ./gradlew --no-daemon dependencies --configuration productionDebugRuntimeClasspath

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon testProductionDebugUnitTest lintProductionDebug

      - name: Build the production-origin QA APK
        run: ./gradlew --no-daemon assembleProductionDebug

      - name: Verify and checksum the APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/production/debug/app-production-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -q 'classes.dex'
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Preserve the verified QA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordinator-production-debug-${{ github.sha }}
          path: |
            Coordinators app/app/build/outputs/apk/production/debug/app-production-debug.apk
            Coordinators app/app/build/outputs/apk/production/debug/app-production-debug.apk.sha256
            Coordinators app/app/build/reports/lint-results-productionDebug.html
          if-no-files-found: error
          retention-days: 14

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordinator-diagnostics-${{ github.sha }}
          path: |
            Coordinators app/app/build/reports/
            Coordinators app/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
