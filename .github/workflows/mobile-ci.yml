name: Global Connect Travels Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_URL: https://tech.gctravels.com/api/v1
  # Compile-verification binaries are intentionally non-distributable and do
  # not carry an EAS project/update identity. Production profiles fail closed.
  EXPO_PUBLIC_APP_ENV: preview
  EXPO_PUBLIC_DEMO_MODE: "false"

jobs:
  quality:
    name: Mobile - contracts, tests, and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Audit runtime dependencies
        # The verifier is fail-closed: every high/critical advisory blocks CI.
        run: npm run audit:runtime
      - name: Verify Expo-supported dependency set
        run: npm run dependencies:check
      - name: Evaluate public Expo configuration
        run: npm run config:validate
      - run: npm run typecheck
      - run: npm run lint
      - name: Run tests and enforce the reviewed coverage floor
        run: npm run test:coverage
      - name: Enforce high-risk module budgets
        run: npm run maintainability:check
      - name: Validate release-Hermes workflow contracts
        run: npm run e2e:contracts
      - name: Generate JavaScript dependency SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > mobile-sbom.cdx.json
      - name: Preserve mobile SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-javascript-sbom-${{ github.sha }}
          path: mobile/mobile-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Bundle Android application
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir dist-ci/android
      - name: Bundle iOS application
        env:
          NODE_ENV: production
        run: npx expo export --platform ios --output-dir dist-ci/ios

  android-release:
    name: Mobile - Android release compile verification
    needs: quality
    runs-on: ubuntu-latest
    # Expo prebuild plus both Android release variants can exceed 35 minutes
    # when the hosted runner has a cold Gradle cache.
    timeout-minutes: 60
    env:
      # The runner-local verification key created below cannot publish an app.
      # Source maps are uploaded only by credentialed distribution builds.
      NODE_ENV: production
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Create ephemeral Android verification signing
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/gc-android-verification-signing"
          keystore_file="${signing_dir}/verification-signing.p12"
          certificate_file="${signing_dir}/verification-signing.der"
          key_alias="ci-verification"
          signing_password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          mkdir -p "${signing_dir}"
          echo "::add-mask::${signing_password}"
          keytool -genkeypair \
            -keystore "${keystore_file}" \
            -storetype PKCS12 \
            -storepass "${signing_password}" \
            -keypass "${signing_password}" \
            -alias "${key_alias}" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=CI Verification, OU=Mobile CI, O=Global Connect Travels, C=IN" \
            -noprompt
          keytool -exportcert \
            -keystore "${keystore_file}" \
            -storepass "${signing_password}" \
            -alias "${key_alias}" \
            -file "${certificate_file}"
          signing_fingerprint="$(node -e "const fs=require('node:fs');const crypto=require('node:crypto');const digest=crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex').toUpperCase();process.stdout.write(digest.match(/../g).join(':'));" "${certificate_file}")"
          {
            printf 'GC_ANDROID_KEYSTORE_FILE=%s\n' "${keystore_file}"
            printf 'GC_ANDROID_KEYSTORE_PASSWORD=%s\n' "${signing_password}"
            printf 'GC_ANDROID_KEY_ALIAS=%s\n' "${key_alias}"
            printf 'GC_ANDROID_KEY_PASSWORD=%s\n' "${signing_password}"
            printf 'GC_ANDROID_DISTRIBUTION_SHA256_CERT_FINGERPRINTS=%s\n' "${signing_fingerprint}"
          } >> "${GITHUB_ENV}"
      # NODE_ENV is production for the full native evidence chain, but the
      # compile-verification job still needs the repository's pinned tooling.
      - run: npm ci --include=dev
      - name: Create non-production Firebase compile fixture
        shell: bash
        run: |
          set -euo pipefail
          google_services_file="${RUNNER_TEMP}/gc-google-services-ci.json"
          node - "${google_services_file}" <<'NODE'
          const { writeFileSync } = require('node:fs');
          const outputFile = process.argv[2];
          const fixture = {
            project_info: {
              project_number: '000000000000',
              project_id: 'gc-ci-compile-fixture',
              storage_bucket: 'gc-ci-compile-fixture.invalid',
            },
            client: [{
              client_info: {
                mobilesdk_app_id: '1:000000000000:android:0000000000000000000000',
                android_client_info: {
                  package_name: 'com.globalconnects.groupcompanion',
                },
              },
              api_key: [{ current_key: 'CI_COMPILE_FIXTURE_NOT_A_CREDENTIAL' }],
            }],
            configuration_version: '1',
          };
          writeFileSync(outputFile, `${JSON.stringify(fixture)}\n`, { mode: 0o600 });
          NODE
          printf 'GOOGLE_SERVICES_JSON=%s\n' "${google_services_file}" >> "${GITHUB_ENV}"
      - name: Generate a clean Android project
        run: npx expo prebuild --clean --platform android --no-install
      - name: Build release variants (verification signing only)
        run: |
          ./android/gradlew -p android --no-parallel \
            "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            "-PreactNativeArchitectures=arm64-v8a" \
            assembleRelease
          node scripts/stage-android-apk.js stage \
            android/app/build/outputs/apk/release/app-release.apk \
            outputs/android-staging/app-release-arm64-v8a.apk \
            arm64-v8a
          ./android/gradlew -p android --no-parallel \
            "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            "-PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64" \
            bundleRelease
          node scripts/stage-android-apk.js verify \
            outputs/android-staging/app-release-arm64-v8a.apk \
            arm64-v8a
      - name: Enforce reviewed APK and AAB size budgets
        run: npm run release:verify-android-size
      - name: Reject accidental production-artifact publication
        run: |
          echo "These binaries use generated verification signing and are not distribution artifacts."
          echo "Production Android binaries must come from the EAS production profile with protected credentials."

  ios-compile:
    name: Mobile - iOS Release compile (unsigned simulator)
    needs: quality
    # Expo SDK 57's expo-modules-jsi package requires Swift tools 6.2.
    # The macOS 26 image supplies Xcode 26; macOS 15 stops at Xcode 16.4/Swift 6.1.
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generate a clean iOS project
        run: npx expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods
        # Dependency-index refreshes belong in a deliberate dependency-update
        # workflow. Release verification consumes the reviewed runner snapshot.
        run: cd ios && pod install
      - name: Compile Release for iOS Simulator without signing
        shell: bash
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -workspace "$workspace" -list -json | ruby -rjson -e 'puts JSON.parse(STDIN.read).dig("workspace", "schemes").first')"
          test -n "$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
