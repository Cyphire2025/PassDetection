appId: com.globalconnects.groupcompanion
---
- extendedWaitUntil:
    visible: "Client manager or coordinator"
    timeout: 30000
- tapOn: "Client manager or coordinator"
- extendedWaitUntil:
    visible:
      id: "staff-email-input"
    timeout: 10000
- tapOn:
    id: "staff-email-input"
- inputText: ${MAESTRO_STAFF_EMAIL}
- tapOn:
    id: "staff-password-input"
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- tapOn:
    id: "staff-sign-in"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 120000
