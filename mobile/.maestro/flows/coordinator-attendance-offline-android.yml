appId: com.globalconnects.groupcompanion
name: Android coordinator attendance offline persistence and confirmation
tags:
  - release-hermes
  - staging-fixture
  - coordinator-attendance
  - android-offline
---
- setAirplaneMode: disabled
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
- runFlow: ../subflows/coordinator-login.yml
- extendedWaitUntil:
    visible: "${MAESTRO_ATTENDANCE_GROUP_NAME}"
    timeout: 120000
- tapOn: "${MAESTRO_ATTENDANCE_GROUP_NAME}"
- tapOn: "Scan"
- extendedWaitUntil:
    visible: "Select a prepared activity"
    timeout: 120000
- extendedWaitUntil:
    visible: "Continue ${MAESTRO_ATTENDANCE_ACTIVITY_NAME}"
    timeout: 120000
- tapOn: "Continue ${MAESTRO_ATTENDANCE_ACTIVITY_NAME}"
- scrollUntilVisible:
    element:
      text: "Event readiness verified"
    direction: DOWN
    timeout: 180000
- setAirplaneMode: enabled
- scrollUntilVisible:
    element:
      text: "Attention needed before event"
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "attendance-e2e-qr-input"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "attendance-e2e-qr-input"
- inputText: ${MAESTRO_ATTENDANCE_QR}
- hideKeyboard
- tapOn:
    id: "attendance-e2e-submit"
- scrollUntilVisible:
    element:
      text: "1 saved on this device.*awaiting server confirmation"
    direction: DOWN
    timeout: 30000
- killApp
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Trips"
    timeout: 120000
- tapOn: "Trips"
- extendedWaitUntil:
    visible: "${MAESTRO_ATTENDANCE_GROUP_NAME}"
    timeout: 60000
- tapOn: "${MAESTRO_ATTENDANCE_GROUP_NAME}"
- tapOn: "Scan"
- scrollUntilVisible:
    element:
      text: "1 saved on this device.*awaiting server confirmation"
    direction: DOWN
    timeout: 120000
- setAirplaneMode: disabled
- tapOn: "Attendance"
- extendedWaitUntil:
    visible: "Final reconciliation"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "1 saved scan still await server confirmation."
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Sync and recheck"
    direction: DOWN
    timeout: 30000
- tapOn: "Sync and recheck"
- extendedWaitUntil:
    visible: "Server counts, this runtime queue, and the coordinator checkpoint were refreshed."
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "Coordinator checkpoint reported 0 unresolved items.*"
    direction: UP
    timeout: 60000
- tapOn: "Scan"
- scrollUntilVisible:
    element:
      text: "Scan QR"
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "attendance-e2e-qr-input"
    direction: DOWN
    timeout: 120000
- tapOn:
    id: "attendance-e2e-qr-input"
- inputText: ${MAESTRO_ATTENDANCE_QR}
- hideKeyboard
- tapOn:
    id: "attendance-e2e-submit"
- scrollUntilVisible:
    element:
      text: "Already confirmed for this activity"
    direction: DOWN
    timeout: 30000
- tapOn: "Attendance"
- scrollUntilVisible:
    element:
      text: "Scan Issues"
    direction: UP
    timeout: 60000
- tapOn: "Open Scan Issues"
- extendedWaitUntil:
    visible: "No scan issues"
    timeout: 60000
- assertVisible: "Every saved scan is confirmed or still in the automatic upload queue."
