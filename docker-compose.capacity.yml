# Local synthetic capacity lane ONLY; combine with docker-compose.qualification.yml.
# The limits are declared in the receipt, not a promise about the production VPS.
services:
  backend:
    cpus: 4
    mem_limit: 2560m
    memswap_limit: 2560m
    environment:
      WEB_CONCURRENCY: "4"
      POSTGRES_API_POOL_SIZE: "3"
      POSTGRES_API_MAX_OVERFLOW: "3"
  worker:
    mem_limit: 384m
    memswap_limit: 384m
  ecr-worker:
    mem_limit: 640m
    memswap_limit: 640m
  scheduler:
    mem_limit: 256m
    memswap_limit: 256m
