# ============================================================
# Docker Compose — Full Development Stack
# ============================================================
# This base file intentionally keeps backend hot reload for local development.
# Staging and production MUST also load docker-compose.prod.yml, which removes
# application source mounts and restores the runtime image's Gunicorn command.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Services:
#   db        — PostgreSQL 16
#   redis     — Redis 7
#   minio     — S3-compatible object storage (local dev)
#   backend   — FastAPI application
#   frontend  — Next.js development server
#   nginx     — Reverse proxy (entry point for all traffic)
# ============================================================

networks:
  passdetection-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: passdetection-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # exposed for local dev tools (e.g., pgAdmin)
    networks:
      - passdetection-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: passdetection-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - passdetection-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local storage) ─────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: passdetection-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"          # API port
      - "9001:9001"          # MinIO console UI
    networks:
      - passdetection-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: passdetection-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      PROCESSING_BACKEND: ${PROCESSING_BACKEND:-celery}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Mount source for hot reload in development
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app"
    networks:
      - passdetection-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: passdetection-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: passdetection-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      PROCESSING_BACKEND: celery
      C_FORCE_ROOT: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "celery -A app.infrastructure.processing.celery_app:celery_app
      worker
      --hostname=general@%h
      --loglevel=INFO
      --concurrency=${WORKER_CONCURRENCY:-2}
      -Q passport_ocr,whatsapp"
    networks:
      - passdetection-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m app.infrastructure.ai_priority.worker_healthcheck
          --destination "general@$$(hostname)"
          --queue passport_ocr
          --queue whatsapp
          --timeout "$${PROCESSING_WORKER_PING_TIMEOUT_SECONDS:-1}"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  extraction-worker:
    image: passdetection-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: passdetection-extraction-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      PROCESSING_BACKEND: celery
      C_FORCE_ROOT: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "celery -A app.infrastructure.processing.celery_app:celery_app
      worker
      --hostname=extraction@%h
      --loglevel=INFO
      --concurrency=${GEMINI_EXTRACTION_MAX_CONCURRENCY:-32}
      -Q interactive-passport-extraction"
    networks:
      - passdetection-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m app.infrastructure.ai_priority.worker_healthcheck
          --destination "extraction@$$(hostname)"
          --queue interactive-passport-extraction
          --timeout "$${PROCESSING_WORKER_PING_TIMEOUT_SECONDS:-1}"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  verification-worker:
    image: passdetection-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: passdetection-verification-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      PROCESSING_BACKEND: celery
      C_FORCE_ROOT: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "celery -A app.infrastructure.processing.celery_app:celery_app
      worker
      --hostname=verification@%h
      --loglevel=INFO
      --concurrency=${GEMINI_VERIFICATION_MAX_CONCURRENCY:-1}
      -Q post-submission-ai-verification"
    networks:
      - passdetection-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m app.infrastructure.ai_priority.worker_healthcheck
          --destination "verification@$$(hostname)"
          --queue post-submission-ai-verification
          --timeout "$${PROCESSING_WORKER_PING_TIMEOUT_SECONDS:-1}"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DEV_APP_URL: ${NEXT_PUBLIC_DEV_APP_URL}
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: passdetection-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_DEV_APP_URL: ${NEXT_PUBLIC_DEV_APP_URL}
    depends_on:
      - backend
    networks:
      - passdetection-net


  # ── Nginx (Reverse Proxy) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.30.4-alpine
    container_name: passdetection-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - passdetection-net
