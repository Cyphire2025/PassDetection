# ============================================================
# Nginx Virtual Host — PassDetection Platform
# ============================================================
# Routes:
#   /api/*     → FastAPI backend
#   /*         → Next.js frontend
# ============================================================

server {
    listen 80;
    server_name _;

    # Keep a local probe available without transmitting application data.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Passport links and form bodies must never be served over plaintext HTTP.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # Accept localhost, LAN IPv4, and production host headers.
    server_name _;

    # Nginx error-log entries can include the original request line and cannot
    # be field-redacted. This server carries bearer tokens in legacy public
    # paths, so discard its request-context error stream and use the sanitized
    # access log plus application/upstream metrics for diagnosis.
    error_log /dev/null crit;

    ssl_certificate /etc/nginx/certs/passdetection-local.crt;
    ssl_certificate_key /etc/nginx/certs/passdetection-local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';"
        always;

    # ── Client Upload Size (passport images) ──────────────────
    # Bound ordinary API requests. Larger document batches are enabled only on
    # the exact authenticated bulk-upload routes below.
    client_max_body_size 16M;
    limit_req_status 429;
    # Nginx's built-in limit_req message contains the original request URI,
    # which includes the public bearer token. The sanitized access log already
    # records limit_req_status, so keep these unsanitized notices below the
    # global warn threshold.
    limit_req_log_level notice;

    # ── Private object previews → MinIO ───────────────────────
    # Presigned S3 URLs are generated as:
    #   https://<public-host>/<bucket>/<object>?X-Amz-...
    # Keep the path intact so the signature remains valid.
    location /passdetection-passports/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # ── API Routes → Backend ──────────────────────────────────
    # The passport archive importer intentionally accepts a large bounded ZIP,
    # and the existing distribution/rename workspaces accept multi-PDF batches.
    # Keep that envelope off login, JSON, and every other API route.
    location ~ ^/api/v1/(?:passports/groups/[^/]+/import-passports/(?:preview|save)|document-distribution/groups/[^/]+/[^/]+/(?:verify|upload|passengers/[^/]+/reupload)|document-rename/batches)/?$ {
        client_max_body_size 512M;
        limit_req zone=api burst=20 nodelay;
        error_page 429 = @api_rate_limited;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Public link bootstrap and qualifier selection use an opaque per-tab
    # browser session plus a shared-network aggregate budget. They must not
    # fall through to the generic per-IP staff API limiter.
    location ~ ^/api/v1/upload-links/token/[^/]+(?:/(?:qualifier-selection|telemetry))?/?$ {
        client_max_body_size 64K;
        limit_req zone=upload_bootstrap_session burst=10 nodelay;
        limit_req zone=upload_bootstrap_aggregate burst=300 nodelay;
        error_page 429 = @upload_bootstrap_rate_limited;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Upload-Session-ID $http_x_upload_session_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # Client confirmation is part of the public upload lifecycle. Keep it on
    # the polling-friendly follow-up buckets instead of the generic staff API
    # per-IP limit.
    location ~ ^/api/v1/passports/[^/]+/client-submit/?$ {
        client_max_body_size 128K;
        limit_req zone=upload_followup_session burst=20 nodelay;
        limit_req zone=upload_followup_aggregate burst=200 nodelay;
        error_page 429 = @upload_followup_rate_limited;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Upload-Session-ID $http_x_upload_session_id;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # DOCS view can display three independently authorized images per row.
    # Keep those streams out of the ordinary API bucket; FastAPI applies the
    # verified per-account dashboard-media limit after authentication.
    location ~ ^/api/v1/passports/[^/]+/images/(?:visa_photo|passport_front|passport_back)(?:/original)?/?$ {
        client_max_body_size 64K;
        limit_req zone=dashboard_media burst=1000 nodelay;
        error_page 429 = @api_rate_limited;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        client_max_body_size 16M;
        limit_req zone=api burst=20 nodelay;
        error_page 429 = @api_rate_limited;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # ── Upload Endpoint — stricter rate limit ─────────────────
    # Follow-up requests prefer the private per-upload header for rate-limit
    # identity. The path submission id is only a proxy fallback bucket and
    # cannot authorize access at the application. This regex is intentionally
    # declared before the initial-upload location.
    location ~ ^/api/v1/passports/upload/[^/]+/[^/]+(?:/.*)?/?$ {
        client_max_body_size 128K;
        limit_req zone=upload_followup_session burst=20 nodelay;
        limit_req zone=upload_followup_aggregate burst=200 nodelay;
        error_page 429 = @upload_followup_rate_limited;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Upload-Session-ID $http_x_upload_session_id;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Initial uploads retain per-session abuse protection while allowing at
    # least 100 delegates behind one hotel/office NAT to begin together.
    location ~ ^/api/v1/passports/upload/[^/]+/?$ {
        # Front, back, and optional Visa Photo are each capped at 10 MiB by the
        # application. Reject aggregate multipart bodies above that bounded
        # envelope at the proxy instead of buffering the server-wide 512 MiB.
        client_max_body_size 35M;
        limit_req zone=upload_session burst=5 nodelay;
        limit_req zone=upload_aggregate burst=100 nodelay;
        error_page 429 = @upload_rate_limited;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Upload-Session-ID $http_x_upload_session_id;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location @api_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"PROXY_RATE_LIMITED","message":"Too many API requests. Please retry shortly."}}';
    }

    location @upload_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"PROXY_UPLOAD_RATE_LIMITED","message":"Too many new uploads are arriving from this network. Please wait and try again."}}';
    }

    location @upload_bootstrap_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"PROXY_UPLOAD_BOOTSTRAP_RATE_LIMITED","message":"Too many upload pages are being opened from this network. Please retry shortly."}}';
    }

    location @upload_followup_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"PROXY_UPLOAD_FOLLOWUP_RATE_LIMITED","message":"Upload status requests are arriving too quickly. Please retry shortly."}}';
    }

    # ── Docs (disabled in production via FastAPI settings) ────
    location /docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Frontend → Next.js ────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Health check endpoint (no rate limiting for monitoring) ─
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
