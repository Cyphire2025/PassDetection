# ============================================================
# Nginx Configuration — Main
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # DOCS thumbnails are deliberately bounded in each browser, but many
    # authenticated staff can still hold concurrent TLS/upstream connections.
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Restore the original address only when the TCP peer is in Cloudflare's
    # published network list. Direct connections cannot spoof
    # CF-Connecting-IP. Keep these CIDRs synchronized with
    # https://www.cloudflare.com/ips/ during infrastructure maintenance.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # ── Logging ──────────────────────────────────────────────
    # Keep access logs useful without recording public upload-link tokens,
    # query-string credentials, or token-bearing Referer values.
    map $uri $safe_log_path {
        ~^/api/v1/passports/upload/ "/api/v1/passports/upload/{token}";
        ~^/api/v1/upload-links/token/ "/api/v1/upload-links/token/{token}";
        ~^/upload/ "/upload/{token}";
        default $uri;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $safe_log_path $server_protocol" '
                      '$status $body_bytes_sent "-" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'request_id=$request_id '
                      'limit_req_status=$limit_req_status '
                      'upstream_status=$upstream_status '
                      'request_time=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # ── Security Headers ──────────────────────────────────────
    server_tokens off;

    # Preserve WebSocket upgrades for the Next.js development server.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Prefer the opaque per-upload credential. When it is absent, the public
    # submission id is used only to key the proxy abuse bucket; it never
    # authorizes the request, and the application still requires the private
    # credential header. Upload-link tokens are excluded from every limiter key.
    map $uri $upload_path_session_id {
        ~^/api/v1/passports/upload/[^/]+/(?<path_submission_id>[^/]+)(?:/|$) $path_submission_id;
        ~^/api/v1/passports/(?<client_submit_id>[^/]+)/client-submit/?$ $client_submit_id;
        default "";
    }

    # Bound the shared-memory key size before it reaches limit_req. The app
    # performs the same validation and binds initial ids to the form's
    # idempotency key.
    map $http_x_upload_session_id $validated_upload_session_id {
        "~^[A-Za-z0-9._:-]{8,128}$" $http_x_upload_session_id;
        default "";
    }

    map $validated_upload_session_id $public_upload_session_key {
        ""      $upload_path_session_id;
        default $validated_upload_session_id;
    }

    # Empty limit_req keys are not counted. Preflight requests therefore reach
    # FastAPI's CORS middleware without consuming or requiring an upload id.
    map $request_method $rate_limit_ip_key {
        OPTIONS "";
        default $binary_remote_addr;
    }

    map $request_method $rate_limit_upload_session_key {
        OPTIONS "";
        default $public_upload_session_key;
    }

    limit_req_zone $rate_limit_ip_key zone=api:10m rate=30r/s;
    # This is a coarse shared-network safety ceiling, not the staff fairness
    # mechanism. FastAPI verifies the JWT and applies atomic per-account
    # minute and burst limits in Redis.
    limit_req_zone $rate_limit_ip_key zone=dashboard_api:10m rate=300r/s;
    # Authorized dashboard image streams are numerous but read-only. Keep
    # their proxy ceiling independent from the ordinary staff API bucket; the
    # application still verifies the JWT and enforces a per-account budget.
    limit_req_zone $rate_limit_ip_key zone=dashboard_media:10m rate=500r/s;
    limit_req_zone $rate_limit_upload_session_key zone=upload_bootstrap_session:10m rate=30r/m;
    limit_req_zone $rate_limit_ip_key zone=upload_bootstrap_aggregate:10m rate=600r/m;
    limit_req_zone $rate_limit_upload_session_key zone=upload_session:10m rate=6r/m;
    limit_req_zone $rate_limit_ip_key zone=upload_aggregate:10m rate=120r/m;
    limit_req_zone $rate_limit_upload_session_key zone=upload_followup_session:10m rate=120r/m;
    limit_req_zone $rate_limit_ip_key zone=upload_followup_aggregate:10m rate=100r/s;


    # ── Upstreams ─────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 128;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # ── Include site configs ──────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
