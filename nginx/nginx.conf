# ============================================================
# Nginx Configuration — Main
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    # Keep access logs useful without recording public upload-link tokens,
    # query-string credentials, or token-bearing Referer values.
    map $uri $safe_log_path {
        ~^/api/v1/passports/upload/ "/api/v1/passports/upload/{token}";
        ~^/api/v1/upload-links/token/ "/api/v1/upload-links/token/{token}";
        ~^/upload/ "/upload/{token}";
        default $uri;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $safe_log_path $server_protocol" '
                      '$status $body_bytes_sent "-" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'request_id=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # ── Security Headers ──────────────────────────────────────
    server_tokens off;

    # Preserve WebSocket upgrades for the Next.js development server.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;


    # ── Upstreams ─────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Include site configs ──────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
