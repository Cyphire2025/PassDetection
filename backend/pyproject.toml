[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "passport-ocr-backend"
version = "1.0.0"
description = "Enterprise-grade Passport OCR Processing Platform — Backend API"
# Production images and every backend CI lane run CPython 3.11. Keep metadata
# honest until a complete 3.12 dependency and native-wheel matrix has passed.
requires-python = ">=3.11,<3.12"
authors = [{ name = "Global Connects Dashboard Team" }]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E4",  # import and indentation errors
    "E7",  # statement errors
    "E9",  # syntax and runtime errors
    "F",   # pyflakes correctness checks
    "I",   # import ordering
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
# Applied migrations are immutable release artifacts. Preserve their original
# import/blank-line formatting while continuing to run correctness rules.
"alembic/versions/**" = ["I001", "E303"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = [
    "service_integration: requires isolated PostgreSQL, Redis, MinIO, and Celery services",
]
