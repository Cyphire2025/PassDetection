<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline | Global Connects Coordinator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding:
          max(1rem, env(safe-area-inset-top))
          max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom))
          max(1rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at top, #dbeafe 0, transparent 42%),
          #f8fafc;
      }

      main {
        width: min(100%, 28rem);
        padding: 1.5rem;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 12px 36px rgb(15 23 42 / 10%);
        text-align: center;
      }

      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 1rem;
        background: #eff6ff;
        color: #2563eb;
        font-size: 1.5rem;
        font-weight: 800;
      }

      h1 {
        margin: 1rem 0 0;
        font-size: 1.35rem;
        line-height: 1.25;
      }

      p {
        margin: 0.65rem 0 0;
        color: #475569;
        font-size: 0.925rem;
        line-height: 1.55;
      }

      a {
        min-height: 3rem;
        margin-top: 1.25rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.65rem;
        padding: 0.75rem 1.25rem;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">GC</div>
      <h1>You are offline</h1>
      <p>
        Reconnect to open the coordinator app. Attendance scans already saved
        inside an open session will sync after you reconnect and reopen the app.
      </p>
      <a href="/coordinator">Try again</a>
    </main>
  </body>
</html>
