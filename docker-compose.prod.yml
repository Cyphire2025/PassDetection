# Staging/production runtime override.
#
# Apply this file after docker-compose.yml. `command: null` restores the
# backend runtime image CMD (Gunicorn with Uvicorn workers), while `!reset`
# removes development-only source bind mounts and internal host publications so
# deployed containers execute the baked image and are reachable only through
# the private Compose network. Nginx remains the public entry point.
#
# Existing installations: use scripts/release_current.py prepare/activate.
# It provisions restricted identities and adds the reviewed storage override
# after verifying a separate copy. A bare Compose up bypasses these release gates.

x-production-security-environment: &production-security-environment
  APP_ENV: production
  APP_DEBUG: "false"
  UNTRUSTED_DOCUMENT_INGESTION_ENABLED: "true"
  MALWARE_SCANNER_ENABLED: "true"
  MALWARE_SCANNER_HOST: clamav
  MALWARE_SCANNER_PORT: "3310"
  MALWARE_SCANNER_TIMEOUT_SECONDS: "10.0"
  METRICS_EXPORTER: statsd
  METRICS_EXPORT_REQUIRED: "true"
  METRICS_STATSD_HOST: metrics-exporter
  METRICS_STATSD_PORT: "9125"
  METRICS_NAMESPACE: passdetection
  # Bootstrap and migration credentials never enter long-running processes.
  POSTGRES_USER: ${POSTGRES_RUNTIME_USER:?Prepare the restricted database identity before deployment}
  POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Prepare the restricted database identity before deployment}
  POSTGRES_RUNTIME_USER: ""
  POSTGRES_RUNTIME_PASSWORD: ""
  POSTGRES_MIGRATION_USER: ""
  POSTGRES_MIGRATION_PASSWORD: ""
  # env_file otherwise leaks these administrator identities to API/workers.
  MINIO_ROOT_USER: ""
  MINIO_ROOT_PASSWORD: ""
  OBJECT_STORAGE_ADMIN_ACCESS_KEY: ""
  OBJECT_STORAGE_ADMIN_SECRET_KEY: ""

x-backend-process-isolation: &backend-process-isolation
  user: "1001:1001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  privileged: false

services:
  # One-off maintenance jobs, never started by a normal `up`. The release helper
  # pins both to the exact tested worker image and takes a backup first.
  database-admin:
    <<: *backend-process-isolation
    profiles: [maintenance]
    image: passdetection-backend
    restart: "no"
    mem_limit: 512m
    cpus: "1.0"
    env_file: [.env]
    environment:
      APP_ENV: development
      POSTGRES_HOST: db
    command: [python, scripts/provision_database_roles.py]
    networks: [passdetection-net]

  database-migrate:
    <<: *backend-process-isolation
    profiles: [maintenance]
    image: passdetection-backend
    restart: "no"
    mem_limit: 512m
    cpus: "1.0"
    env_file: [.env]
    environment:
      APP_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Prepare the migration identity before deployment}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Prepare the migration identity before deployment}
      POSTGRES_RUNTIME_USER: ""
      POSTGRES_RUNTIME_PASSWORD: ""
      POSTGRES_MIGRATION_USER: ""
      POSTGRES_MIGRATION_PASSWORD: ""
    command: [alembic, upgrade, head]
    networks: [passdetection-net]

  metrics-exporter:
    ports: !reset []

  db:
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPUS:-2.0}
    ports: !reset []

  redis:
    mem_limit: ${REDIS_SECURITY_MEMORY_LIMIT:-384m}
    cpus: ${REDIS_SECURITY_CPUS:-0.5}
    ports: !reset []

  redis-broker:
    mem_limit: ${REDIS_BROKER_MEMORY_LIMIT:-1536m}
    cpus: ${REDIS_BROKER_CPUS:-1.0}
    ports: !reset []

  redis-realtime:
    mem_limit: ${REDIS_REALTIME_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_REALTIME_CPUS:-0.5}
    ports: !reset []

  redis-cache:
    mem_limit: ${REDIS_CACHE_MEMORY_LIMIT:-384m}
    cpus: ${REDIS_CACHE_CPUS:-0.5}
    ports: !reset []

  minio:
    mem_limit: ${MINIO_MEMORY_LIMIT:-1g}
    cpus: ${MINIO_CPUS:-1.0}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a separate MinIO administrator identity}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a separate MinIO administrator secret}
    ports: !reset []

  backend:
    <<: *backend-process-isolation
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536m}
    cpus: ${BACKEND_CPUS:-2.0}
    command: null
    volumes: !reset []
    ports: !reset []
    environment:
      <<: *production-security-environment
      PROCESSING_BACKEND: celery
      LOGIN_LOCKOUT_REQUIRE_REDIS: "true"
      PUBLIC_UPLOAD_RATE_LIMIT_REQUIRE_REDIS: "true"
      MOBILE_REALTIME_ENABLED: "true"
      MOBILE_REALTIME_REQUIRE_REDIS: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/api/v1/health/ready', timeout=5)

  worker:
    <<: *backend-process-isolation
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    cpus: ${WORKER_CPUS:-1.0}
    # Replace the development source bind; only the push consumer can read this
    # operator-managed directory. It may be empty while push remains disabled.
    volumes: !override
      - type: bind
        source: /opt/global-connect-secrets/fcm
        target: /run/gc-fcm
        read_only: true
        bind:
          create_host_path: false
    environment:
      <<: *production-security-environment
      MOBILE_PUSH_FCM_CREDENTIALS_FILE: /run/gc-fcm/service-account.json

  email-worker:
    <<: *backend-process-isolation
    mem_limit: ${EMAIL_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${EMAIL_WORKER_CPUS:-1.0}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  my-photos-worker:
    <<: *backend-process-isolation
    mem_limit: ${MY_PHOTOS_WORKER_MEMORY_LIMIT:-1536m}
    cpus: ${MY_PHOTOS_WORKER_CPUS:-2.0}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  email-ai-worker:
    <<: *backend-process-isolation
    mem_limit: ${EMAIL_AI_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${EMAIL_AI_WORKER_CPUS:-1.0}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  email-beat:
    <<: *backend-process-isolation
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-384m}
    cpus: ${SCHEDULER_CPUS:-0.5}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  extraction-worker:
    <<: *backend-process-isolation
    mem_limit: ${EXTRACTION_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${EXTRACTION_WORKER_CPUS:-2.0}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  verification-worker:
    <<: *backend-process-isolation
    mem_limit: ${VERIFICATION_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${VERIFICATION_WORKER_CPUS:-1.0}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  visa-ai-worker:
    <<: *backend-process-isolation
    mem_limit: ${VISA_AI_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${VISA_AI_WORKER_CPUS:-1.0}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  ecr-worker:
    <<: *backend-process-isolation
    mem_limit: ${ECR_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${ECR_WORKER_CPUS:-1.0}
    volumes: !reset []
    environment:
      <<: *production-security-environment

  frontend:
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-768m}
    cpus: ${FRONTEND_CPUS:-1.0}
    build:
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
        NEXT_PUBLIC_APP_REVISION: ${APP_REVISION:-unknown}
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DEV_APP_URL: ""
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_DEV_APP_URL: ""

  nginx:
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.5}
