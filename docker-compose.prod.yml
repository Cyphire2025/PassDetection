# Staging/production runtime override.
#
# Apply this file after docker-compose.yml. `command: null` restores the
# backend runtime image CMD (Gunicorn with Uvicorn workers), while `!reset`
# removes development-only source bind mounts and internal host publications so
# deployed containers execute the baked image and are reachable only through
# the private Compose network. Nginx remains the public entry point.
#
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-production-security-environment: &production-security-environment
  APP_ENV: production
  APP_DEBUG: "false"
  UNTRUSTED_DOCUMENT_INGESTION_ENABLED: "true"
  MALWARE_SCANNER_ENABLED: "true"
  MALWARE_SCANNER_HOST: clamav
  MALWARE_SCANNER_PORT: "3310"
  MALWARE_SCANNER_TIMEOUT_SECONDS: "10.0"
  METRICS_EXPORTER: statsd
  METRICS_EXPORT_REQUIRED: "true"
  METRICS_STATSD_HOST: metrics-exporter
  METRICS_STATSD_PORT: "9125"
  METRICS_NAMESPACE: passdetection

services:
  metrics-exporter:
    ports: !reset []

  db:
    ports: !reset []

  redis:
    ports: !reset []

  redis-broker:
    ports: !reset []

  redis-realtime:
    ports: !reset []

  redis-cache:
    ports: !reset []

  minio:
    ports: !reset []

  backend:
    command: null
    volumes: !reset []
    ports: !reset []
    environment:
      <<: *production-security-environment
      PROCESSING_BACKEND: celery
      LOGIN_LOCKOUT_REQUIRE_REDIS: "true"
      PUBLIC_UPLOAD_RATE_LIMIT_REQUIRE_REDIS: "true"
      MOBILE_REALTIME_ENABLED: "true"
      MOBILE_REALTIME_REQUIRE_REDIS: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/api/v1/health/ready', timeout=5)

  worker:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  email-worker:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  my-photos-worker:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  email-ai-worker:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  email-beat:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  extraction-worker:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  verification-worker:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  visa-ai-worker:
    volumes: !reset []
    environment:
      <<: *production-security-environment

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DEV_APP_URL: ""
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_DEV_APP_URL: ""
